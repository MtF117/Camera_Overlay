<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>カメラ + Dropbox</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: sans-serif;
      color: white;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
    }

    .controls {
      padding: 8px 10px;
      background: rgba(0,0,0,0.9);
      text-align: center;
      flex-shrink: 0;
      max-height: 42vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    button, select {
      margin: 4px;
      padding: 8px 12px;
      font-size: 15px;
    }

    #folderSelect, #overlaySelect {
      max-width: 95%;
      min-width: 200px;
    }

    .slider-container { margin: 6px 0; }

    .row { margin: 6px 0; }
    .row label.title {
      display: inline-block;
      width: 84px;
      font-size: 14px;
    }

    .check-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 4px 6px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .check-label input {
      width: 18px;
      height: 18px;
    }

    #status {
      font-size: 12px;
      color: #ccc;
      margin-top: 6px;
      word-break: break-all;
    }

    .container {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      background: #111;
      overflow: hidden;
    }

    video, #overlay, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #overlay {
      pointer-events: none;
      z-index: 10;
    }

    canvas { z-index: 20; }

    /* 横向き: 左=カメラ / 右=操作 */
    @media (orientation: landscape) {
      .app {
        flex-direction: row-reverse;
        height: 100dvh;
      }

      .controls {
        width: min(34vw, 320px);
        max-width: 340px;
        max-height: none;
        height: 100dvh;
        overflow-y: auto;
        text-align: left;
        padding: 10px;
        border-left: 1px solid #333;
        border-right: none;
      }

      .controls button,
      .controls select {
        display: block;
        width: calc(100% - 8px);
        margin: 6px 0;
      }

      .controls .row {
        margin: 8px 0;
      }

      .controls .row label.title {
        display: block;
        width: auto;
        margin-bottom: 4px;
        font-size: 13px;
        color: #aaa;
      }

      #folderSelect, #overlaySelect {
        min-width: 0;
        width: 100%;
        max-width: 100%;
      }

      .check-label {
        display: flex;
        margin: 8px 0;
      }

      .slider-container {
        margin: 10px 0;
      }

      .slider-container input[type="range"] {
        width: 70%;
        vertical-align: middle;
      }

      .container {
        flex: 1;
        height: 100dvh;
        width: auto;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .controls {
        width: min(38vw, 300px);
        padding: 6px 8px;
        font-size: 13px;
      }

      button, select {
        padding: 6px 8px;
        font-size: 13px;
        margin: 4px 0;
      }

      .check-label {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="controls">
      <button onclick="shoot()">撮影</button>
      <button onclick="initDropbox()">再読み込み</button>

      <hr style="border-color:#333;">

      <div class="row">
        <label class="title">フォルダ:</label>
        <select id="folderSelect" onchange="onFolderChange()">
          <option value="">読み込み中...</option>
        </select>
      </div>

      <label class="check-label">
        <input type="checkbox" id="folderCompleteCheck" onchange="toggleFolderComplete()">
        このフォルダを完了済みにする
      </label>

      <div class="row">
        <label class="title">オーバーレイ:</label>
        <select id="overlaySelect" onchange="changeOverlay()">
          <option value="">フォルダを選択</option>
        </select>
      </div>

      <label class="check-label">
        <input type="checkbox" id="imageCompleteCheck" onchange="toggleImageComplete()">
        この画像を完了済みにする
      </label>

      <div class="slider-container">
        <label class="title">透明度:</label>
        <input type="range" id="opacitySlider" min="0" max="100" value="50"
               oninput="updateOpacity(this.value)">
        <span id="opacityValue">50%</span>
      </div>

      <div id="status">準備中...</div>
    </div>

    <div class="container">
      <video id="camera" autoplay muted playsinline></video>
      <img id="overlay" alt="overlay" crossorigin="anonymous">
      <canvas id="canvas" style="display:none;"></canvas>
    </div>
  </div>

  <script>
    // ★★★ ここだけ書き換えてください ★★★
    const ACCESS_TOKEN = "sl.u.AGtaFQs5pytu7YmBw0fB5MA0-BsE4PxBm1dUCMa7qmzTt5Lxp68xlZEEej6X-6viQ4XY78gev7MIbugMNBht2bMizxX4YDhGrUeVvuDCfdssEG42GHuezJZLKdcawe71ll5aUnnGSxS_yJ-V9fJHCU-i0qSzTdoNeIzJ8hagA6MrxcQPmHhy3k3YbtCqxlPeRIH44ZJXWYSds4WkGMaYgQuXsy-BrYjHPCykkWA6wDWSzJtnHLOlVd900bNJ4h-97hMJmnN5xUoxk5S31h_xXdqP4SoaJ28NFw-i8xNrXCV-TyWHcMbtPSFWif48gFMB8tzASHgKIWow7kR-kR38f5zFNYJ_y7fLQXtzoTByzIH5F-cfSDEbvVCtQliqdpU1dgM8D_7p4M9k-4bHC-vEAYybr8sqRDcK1FhMZY6eB3Fq_UHhnT-U6vAJvIr3jA1LNxrI-d0xG6UD1hGvmRoilcKY7lYNTZVcR6AcCXyfUuWvI272L0iY5U78B9O07HeRe5qLzugqwCQDvLNLkYvxz0FMkcDShca9PsBq-CiQ0YTwV9-rjxiAmNjjOZdiCMdSPx3owXSd4glPqKBF7q0wt7O4cuP8pvabS4ufaiNdGZ8ub0dYN_PhkchHg06jrLIMp2tEqhUL7VCYFL8ma-hdsmz8oO5Jem6koDCGwQg0pmJ_ERrQjAUgNjBzd7ivtJS_berkgReXiCl7ImwrD1IKAmkV9PT_4LujV1wwx23Wat5hi0dHplzaGPqTGaylQnoyMgKX987kvA2ZvcFwjdLXEZPv1bmkwG7H-vK6kdUf7HMVa26eSxpAJ6WdvSZMBZ-EAk48oyUp2OcVGaQWbTbkpxGx9_8XjuQWZe3ai-FjZM60T-9cU52BbD5NPCake_aoFHcm4A2dkRwTIwlrO1GfgJFpnoxmtPhKrR9S4AdPPXCbZFB1jKj_NGDC2AzASLPjrLSrHv-HEZJRbhFNq0oHgq_lbeheFTu3qzx6Z46F_x6fU0Jp0EOhMKwmsmwY6sO_rrmi7LsFLY3qpahN1SlQI-YVCh7wqhHsMWnhwp2V2SHWIE8dAwyCi-tbWOPa7pPS55ja1l1BluAEQREpzonCeHjoRx05kb6bKy_Ha_ImpKF2Aidgue4hPewDmBhiAhG6H8FeoKlA7m6Xe224s7Y-uLfs5HWwo83vjgDjCkSJjhn9AbDdxrquWoURd171Q06LEpgLonsuvWbRcb8mhEx6DlNTjo5Zh7Pzk1qnYSI5aG5kViCA6ZDW8SxOeUPX9AAcBgO7fbB8u6lm8slqEoaVv7heikaWBAxa77wj831JfOkZZA";
    const FOLDER_PATH = "/test";
    // ★★★★★★★★★★★★★★★★★★★★★★

    const FOLDER_STORAGE_KEY = "dropbox_completed_folders";
    const IMAGE_STORAGE_KEY = "dropbox_completed_images";

    let stream = null;
    let currentOpacity = 0.5;
    let overlays = [{ name: "なし", src: "", path: "" }];
    let folderList = [];

    const video = document.getElementById("camera");
    const overlay = document.getElementById("overlay");
    const canvas = document.getElementById("canvas");
    const folderSelect = document.getElementById("folderSelect");
    const overlaySelect = document.getElementById("overlaySelect");
    const folderCompleteCheck = document.getElementById("folderCompleteCheck");
    const imageCompleteCheck = document.getElementById("imageCompleteCheck");
    const statusEl = document.getElementById("status");

    function loadList(key) {
      try {
        return JSON.parse(localStorage.getItem(key) || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveList(key, list) {
      localStorage.setItem(key, JSON.stringify(list));
    }

    function isFolderCompleted(path) {
      return loadList(FOLDER_STORAGE_KEY).indexOf(path) !== -1;
    }

    function isImageCompleted(path) {
      if (!path) return false;
      return loadList(IMAGE_STORAGE_KEY).indexOf(path) !== -1;
    }

    async function dropboxApi(endpoint, body) {
      const res = await fetch("https://api.dropboxapi.com/2/" + endpoint, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + ACCESS_TOKEN,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(JSON.stringify(data, null, 2));
      }
      return data;
    }

    async function listAllEntries(path, recursive) {
      let entries = [];
      let data = await dropboxApi("files/list_folder", {
        path: path,
        recursive: !!recursive
      });
      entries = entries.concat(data.entries || []);

      while (data.has_more) {
        data = await dropboxApi("files/list_folder/continue", {
          cursor: data.cursor
        });
        entries = entries.concat(data.entries || []);
      }
      return entries;
    }

    function getDepth(path) {
      const root = FOLDER_PATH.replace(/\/$/, "").toLowerCase();
      let rel = path.toLowerCase();
      if (rel.indexOf(root) === 0) {
        rel = rel.slice(root.length);
      }
      rel = rel.replace(/^\//, "");
      if (!rel) return 0;
      return rel.split("/").filter(Boolean).length;
    }

    function toggleFolderComplete() {
      const path = folderSelect.value;
      if (!path) return;

      let list = loadList(FOLDER_STORAGE_KEY);
      if (folderCompleteCheck.checked) {
        if (list.indexOf(path) === -1) list.push(path);
      } else {
        list = list.filter(function(p) { return p !== path; });
      }
      saveList(FOLDER_STORAGE_KEY, list);
      renderFolderSelect(path);
      statusEl.textContent = folderCompleteCheck.checked
        ? "フォルダを完了済みにしました"
        : "フォルダの完了を解除しました";
    }

    function toggleImageComplete() {
      const index = parseInt(overlaySelect.value);
      if (isNaN(index) || !overlays[index] || !overlays[index].path) {
        imageCompleteCheck.checked = false;
        return;
      }

      const path = overlays[index].path;
      let list = loadList(IMAGE_STORAGE_KEY);

      if (imageCompleteCheck.checked) {
        if (list.indexOf(path) === -1) list.push(path);
      } else {
        list = list.filter(function(p) { return p !== path; });
      }

      saveList(IMAGE_STORAGE_KEY, list);
      renderOverlaySelect(index);
      statusEl.textContent = imageCompleteCheck.checked
        ? "画像を完了済みにしました: " + overlays[index].name
        : "画像の完了を解除しました: " + overlays[index].name;
    }

    function renderFolderSelect(selectedPath) {
      folderSelect.innerHTML = "";
      folderList.forEach(function(folder) {
        const option = document.createElement("option");
        option.value = folder.path;
        const indent = "　".repeat(folder.depth);
        const mark = isFolderCompleted(folder.path) ? "✅ " : "📁 ";
        option.textContent = indent + mark + folder.name;
        folderSelect.appendChild(option);
      });
      if (selectedPath) folderSelect.value = selectedPath;
      folderCompleteCheck.checked = selectedPath ? isFolderCompleted(selectedPath) : false;
    }

    function renderOverlaySelect(selectedIndex) {
      overlaySelect.innerHTML = "";
      for (let i = 0; i < overlays.length; i++) {
        const item = overlays[i];
        const option = document.createElement("option");
        option.value = i;
        if (!item.path) {
          option.textContent = item.name;
        } else {
          const mark = isImageCompleted(item.path) ? "✅ " : "🖼️ ";
          option.textContent = mark + item.name;
        }
        overlaySelect.appendChild(option);
      }
      if (typeof selectedIndex === "number" && !isNaN(selectedIndex)) {
        overlaySelect.value = String(selectedIndex);
      }
      syncImageCompleteCheck();
    }

    function syncImageCompleteCheck() {
      const index = parseInt(overlaySelect.value);
      if (isNaN(index) || !overlays[index] || !overlays[index].path) {
        imageCompleteCheck.checked = false;
        imageCompleteCheck.disabled = true;
        return;
      }
      imageCompleteCheck.disabled = false;
      imageCompleteCheck.checked = isImageCompleted(overlays[index].path);
    }

    function initOverlaySelect() {
      renderOverlaySelect(0);
    }

    async function initDropbox() {
      statusEl.textContent = "フォルダツリーを読み込み中...";
      folderSelect.innerHTML = "";
      overlaySelect.innerHTML = '<option value="">フォルダを選択</option>';
      overlays = [{ name: "なし", src: "", path: "" }];
      overlay.style.display = "none";
      folderList = [];
      imageCompleteCheck.checked = false;
      imageCompleteCheck.disabled = true;

      try {
        const entries = await listAllEntries(FOLDER_PATH, true);
        const folders = entries.filter(function(e) {
          return e[".tag"] === "folder";
        });
        folders.sort(function(a, b) {
          return a.path_lower.localeCompare(b.path_lower);
        });

        folderList.push({
          path: FOLDER_PATH,
          name: "（ルート）",
          depth: 0
        });

        folders.forEach(function(folder) {
          folderList.push({
            path: folder.path_lower,
            name: folder.name,
            depth: getDepth(folder.path_lower)
          });
        });

        renderFolderSelect(FOLDER_PATH);
        statusEl.textContent = "フォルダ " + folderList.length + " 個を読み込みました";
        await loadImagesFromPath(FOLDER_PATH);
      } catch (err) {
        console.error(err);
        statusEl.textContent = "エラー: " + err.message;
        alert("フォルダの読み込みに失敗しました\n\n" + err.message);
      }
    }

    async function onFolderChange() {
      const path = folderSelect.value;
      if (!path) return;
      folderCompleteCheck.checked = isFolderCompleted(path);
      await loadImagesFromPath(path);
    }

    async function loadImagesFromPath(path) {
      statusEl.textContent = "画像を読み込み中... " + path;
      overlays = [{ name: "なし", src: "", path: "" }];
      overlay.style.display = "none";
      imageCompleteCheck.checked = false;
      imageCompleteCheck.disabled = true;

      try {
        const entries = await listAllEntries(path, false);
        const imageFiles = entries.filter(function(entry) {
          return entry[".tag"] === "file" &&
                 /\.(png|jpe?g|gif|webp)$/i.test(entry.name);
        });

        if (imageFiles.length === 0) {
          statusEl.textContent = "このフォルダに画像がありません";
          initOverlaySelect();
          return;
        }

        for (let i = 0; i < imageFiles.length; i++) {
          const file = imageFiles[i];
          const linkData = await dropboxApi("files/get_temporary_link", {
            path: file.path_lower
          });
          if (linkData.link) {
            overlays.push({
              name: file.name,
              src: linkData.link,
              path: file.path_lower
            });
          }
        }

        statusEl.textContent = "成功！ " + (overlays.length - 1) + " 枚の画像を読み込みました";
        initOverlaySelect();
      } catch (err) {
        console.error(err);
        statusEl.textContent = "エラー: " + err.message;
        alert("画像の読み込みに失敗しました\n\n" + err.message);
      }
    }

    async function startCamera() {
      try {
        if (stream) {
          stream.getTracks().forEach(function(t) { t.stop(); });
        }
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
        video.srcObject = stream;
      } catch (e) {
        alert("カメラを起動できませんでした");
        console.error(e);
      }
    }

    function changeOverlay() {
      const index = parseInt(overlaySelect.value);
      if (isNaN(index) || !overlays[index]) return;

      const selected = overlays[index];
      syncImageCompleteCheck();

      if (selected.src) {
        overlay.crossOrigin = "anonymous";
        overlay.src = selected.src;
        overlay.style.display = "block";
        updateOpacity(document.getElementById("opacitySlider").value);
      } else {
        overlay.style.display = "none";
      }
    }

    function updateOpacity(value) {
      currentOpacity = value / 100;
      overlay.style.opacity = currentOpacity;
      document.getElementById("opacityValue").textContent = value + "%";
    }

    function shoot() {
      if (!stream) {
        alert("カメラが起動していません");
        return;
      }

      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext("2d");

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      if (overlay.style.display !== "none" && overlay.src) {
        ctx.globalAlpha = currentOpacity;
        try {
          ctx.drawImage(overlay, 0, 0, canvas.width, canvas.height);
        } catch (e) {
          console.warn("合成失敗", e);
        }
        ctx.globalAlpha = 1;
      }

      canvas.style.display = "block";
      video.style.display = "none";
      overlay.style.display = "none";

      const a = document.createElement("a");
      a.download = "photo_" + new Date().toISOString().slice(0, 19) + ".png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    }

    window.addEventListener("orientationchange", function() {
      setTimeout(function() {
        window.scrollTo(0, 0);
      }, 100);
    });

    window.onload = function() {
      startCamera();
      initDropbox();
    };
  </script>
</body>
</html>
