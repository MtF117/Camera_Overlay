<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>カメラ + Dropbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="controls">
<!-- 設定エリア -->
<div class="row" style="margin-top: 8px;">
  <label class="title">トークン:</label>
  <input type="password" id="tokenInput" placeholder="Dropboxアクセストークン"
         style="width: 95%; max-width: 320px; padding: 6px; font-size: 14px;">
</div>

<div class="row">
  <label class="title">フォルダ:</label>
  <input type="text" id="folderPathInput" placeholder="/Overlays または 空欄"
         style="width: 95%; max-width: 320px; padding: 6px; font-size: 14px;">
</div>

<button onclick="saveConfig()">設定を保存</button>

<hr style="border-color:#333;">

<button onclick="startCamera()">カメラを起動</button>
<button onclick="shoot()">撮影</button>
<button onclick="initDropbox()">再読み込み</button>

      <hr style="border-color:#333;">

      <div class="row">
        <label class="title">フォルダ:</label>
        <select id="folderSelect" onchange="onFolderChange()">
          <option value="">読み込み中...</option>
        </select>
      </div>

      <label class="check-label">
        <input type="checkbox" id="folderCompleteCheck" onchange="toggleFolderComplete()">
        このフォルダを完了済みにする
      </label>

      <div class="row">
        <label class="title">オーバーレイ:</label>
        <select id="overlaySelect" onchange="changeOverlay()">
          <option value="">フォルダを選択</option>
        </select>
      </div>

      <label class="check-label">
        <input type="checkbox" id="imageCompleteCheck" onchange="toggleImageComplete()">
        この画像を完了済みにする
      </label>

      <div class="slider-container">
        <label class="title">透明度:</label>
        <input type="range" id="opacitySlider" min="0" max="100" value="50"
               oninput="updateOpacity(this.value)">
        <span id="opacityValue">50%</span>
      </div>

      <div id="status">準備中...</div>
    </div>

    <div class="container">
      <video id="camera" autoplay muted playsinline></video>
      <img id="overlay" alt="overlay" crossorigin="anonymous">
      <canvas id="canvas" style="display:none;"></canvas>
    </div>
  </div>

  <!-- config.js を先に読み込む（順番が重要） -->
  <script src="app.js"></script>
</body>
</html>
